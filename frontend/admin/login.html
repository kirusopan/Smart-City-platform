<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart City Platform</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>
    <!-- Floating Shapes -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="bi bi-building"></i>
                </div>
                <h1 class="logo-title">SmartCity</h1>
                <p class="logo-subtitle">City Management Platform</p>
            </div>

            <!-- Alert Messages (Hidden by default) -->
            <div id="alertContainer"></div>

            <!-- Form Tabs -->
            <div class="form-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="form-content active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-group-custom">
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                            <i class="bi bi-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-group-custom">
                            <input type="password" id="loginPassword" class="form-control"
                                placeholder="Enter your password" required>
                            <i class="bi bi-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="forgot-link" onclick="showForgotPassword(event)">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-submit" id="loginBtn">
                        Login to Dashboard
                    </button>
                </form>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google" onclick="socialLogin('google')" title="Continue with Google">
                        <i class="bi bi-google"></i>
                    </button>
                    <button class="social-btn microsoft" onclick="socialLogin('microsoft')"
                        title="Continue with Microsoft">
                        <i class="bi bi-microsoft"></i>
                    </button>
                    <button class="social-btn apple" onclick="socialLogin('apple')" title="Continue with Apple">
                        <i class="bi bi-apple"></i>
                    </button>
                </div>

                <div class="bottom-link">
                    Don't have an account? <a href="#" onclick="switchTab('register')">Register now</a>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-content">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <div class="input-group-custom">
                            <input type="text" class="form-control" placeholder="Enter your full name" required>
                            <i class="bi bi-person input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-group-custom">
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                            <i class="bi bi-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-group-custom">
                            <input type="password" id="registerPassword" class="form-control"
                                placeholder="Create a password" required>
                            <i class="bi bi-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-group-custom">
                            <input type="password" id="confirmPassword" class="form-control"
                                placeholder="Confirm your password" required>
                            <i class="bi bi-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-check" style="margin-bottom: 1.5rem;">
                        <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                        <label class="form-check-label" for="agreeTerms">
                            I agree to the <a href="#" style="color: var(--primary-color);">Terms & Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit" id="registerBtn">
                        Create Account
                    </button>
                </form>

                <div class="divider">
                    <span>Or register with</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google" onclick="socialLogin('google')" title="Continue with Google">
                        <i class="bi bi-google"></i>
                    </button>
                    <button class="social-btn microsoft" onclick="socialLogin('microsoft')"
                        title="Continue with Microsoft">
                        <i class="bi bi-microsoft"></i>
                    </button>
                    <button class="social-btn apple" onclick="socialLogin('apple')" title="Continue with Apple">
                        <i class="bi bi-apple"></i>
                    </button>
                </div>

                <div class="bottom-link">
                    Already have an account? <a href="#" onclick="switchTab('login')">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/login.js"></script>


</body>

</html>
